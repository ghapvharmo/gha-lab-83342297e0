name: Comment on PR for CI Failure
permissions:
  pull-requests: write

on:
  workflow_run:
    workflows: [Monkey CI]
    types: [completed]

jobs:
  on-failure:
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Download workflow artifact
        uses: dawidd6/action-download-artifact@891cccee4b25d3306cf5edafa174ddc1d969871f # v2.11.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: peek_icons.yml
          run_id: ${{ github.event.workflow_run.id }}

      - name: Read the pr_num file
        id: pr_num_reader
        uses: juliangruber/read-file-action@e0a316da496006ffd19142f0fd594a1783f3b512 # v1.0.0
        with:
          path: ./pr_num/pr_num.txt

      - name: Create comment
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          github-token: ${{ secrets.API_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ steps.pr_num_reader.outputs.content }},
              owner: context.repo.owner,
              repo: context.repo.repo,
               body: 'Continuous integration check(s) failed. Please review the failing check\'s logs and make the necessary changes. ' + context.payload.workflow_run.html_url
            })
