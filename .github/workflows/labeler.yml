name: "Pull Request Labeler"
on:
  - pull_request_target

jobs:
  triage:
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/labeler@ac9175f8a1f3625fd0d4fb234536d26811351594 # v4
      with:
        repo-token: "${{ secrets.API_TOKEN }}"
